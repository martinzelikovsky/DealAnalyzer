# Deal Analyzer Configuration Template
# Use this file to configure input/output settings and Keepa API behavior.

# --- Input Configuration ---
input_config:
  # Regex pattern to identify which tabs in the Excel file to process.
  # Default: 'Detail_\d+' (Matches Detail_1, Detail_2, etc.)
  tab_regex: 'Detail_\d+'
  
  # The name of the sheet containing tab aggregations (like FOB Cost and Offer Rate).
  summary_sheet_name: 'Summary'

# --- Evaluation Configuration ---
evaluation_config:
  # How to determine the "Current Value" price from Keepa data.
  value_proxy: 'keepa_minInIntervalNEW' 
  
  # A safety margin to discount what we believe the item can be sold for
  # (e.g. 0.15 means estimating the sale price will be 15% less than the Keepa proxy).
  margin_rate: 0.15 
  
  # The percentage of the purchase price (Unit_Cost) we expect to recover for unenriched items.
  # 0.0 means assume unsellable ($0). 1.0 means we break even (sell for 100% of what we paid).
  unenriched_sale_rate: 0.0

# --- Distribution Configuration ---
distribution_config:
  # Select which distributions to create and include in the report. Each will be broken down by Tab.
  by_category: true
  by_category_subcategory: true
  by_msrp: true

# --- Output Configuration ---
output_config:
  # Prefix added to columns fetched from Keepa to distinguish them from original data.
  enrichment_col_prefix: keepa_

  # List of columns to extract from the Keepa API response.
  # Format: <field_name>: <data_type>
  # Data types supported: str, float, int
  enrichment_cols:
    title: str
    brand: str
    description: str
    manufacturer: str
    model: str
    partNumber: str

    min: float
    max: float
    avg: float
    minInInterval: float
    maxInInterval: float

    categoryTree: str
    monthlySold: int
    salesRank: int
    availabilityAmazon: str
    releaseDate: str
    productType: str

# --- Execution Parameters ---
execution_params:
  # Target platform for path handling. Options: windows, unix
  platform: unix
  
  # Directory where input Excel files are located.
  # Supports home directory expansion (e.g., ~/path/to/files)
  input_dir: ~/deal_analyzer_input
  
  # Directory where results and checkpoints will be saved.
  results_dir: results
  
  # Number of days to look back for historical statistics (min/max/avg prices).
  lookback_days: 30
  
  # Number of ASINs to process in a single Keepa API call.
  batch_size: 20
  
  # Keepa Marketplace Domain.
  # Options: US, GB, DE, FR, JP, CA, IT, ES, IN, MX, BR, AU
  domain: CA
  
  # Name of the log file generated during the run.
  log_name: deal_analyzer.log
